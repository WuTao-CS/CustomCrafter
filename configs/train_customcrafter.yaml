model:
  base_learning_rate: 1.0e-05
  target: lvdm.models.ddpm3d_lora.LoRaCrossAttenDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 1
    timesteps: 1000
    loss_type: l1
    first_stage_key: video
    cond_stage_key: caption
    image_size:
    - 40
    - 64
    channels: 4
    cond_stage_trainable: True   # Note: different from the one we trained before
    add_token: True
    conditioning_key: crossattn
    # monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False
    uncond_type: empty_seq
    use_scale: true
    scale_b: 0.7
    # fix_scale_bug: true
    # Lora params
    lora_rank: 4
    inject_unet: true
    inject_clip: false
    inject_unet_key_word: ["BasicTransformerBlock","CrossAttention"] # 实际只插入了Cross Attention
    inject_init_attn: False
    inject_ffn: false
    inject_clip_key_word: null
    inject_ta: False
    # joint train
    # joint_train: true
    text_model_type: openclip
    unet_config:
      target: lvdm.modules.networks.openaimodel3d.UNetModel
      params:
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_head_channels: 64
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: false
        temporal_conv: true
        temporal_attention: true
        temporal_selfatt_only: true
        use_relative_position: false
        use_causal_attention: false
        temporal_length: 16
        addition_attention: true
        fps_cond: true
    first_stage_config:
      target: lvdm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 512
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: lvdm.modules.encoders.custom_condition.FrozenOpenCLIPEmbedderWrapper
      params:
        layer: penultimate
        modifier_token: <new1>
        initializer_token: toy

data:
  target: custom.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 4
    with_prior_preservation: True
    wrap: false
    train:
      target: lvdm.data.customdata_new.MaskBase
      params:
        size: [320,512]
        num_frames: 4
        with_prior_preservation: True
        aug: True
lightning:
  # strategy: deepspeed_stage_2
  trainer:
    max_epochs: 200