model_name: Custom_video_diffusion # 实验名称
description: "Custom video" # 模型描述说明
resource_group_name: rg-pcgarc-chongqin #rg-pcgarc-chongqin rg_pcgarc_v100_cq_unreliable
priority: high # 优先级，非必填
framework: pytorch # 可选，训练框架 默认 tensorflow 类型
resource:
  worker_num: 1 # worker数，等于1为单机实验，大于1为多机试验
  worker: # 每个worker的配置
    cpu: 8 # worker cpu核数
    gpu: 4 # worker gpu卡数
    memory: 1 # 每个CPU内存大小Gb
train:
  program:
    work_dir: /group/40034/jerryxwli/code/VideoCrafter_Share/
    main_program: bash/custom.sh # 执行程序名称
    init_program: /group/40034/jerryxwli/code/VideoCrafter_Share/bash/init.sh # 环境初始化脚本，比如安装一些镜像中不存在但是又需要的包
